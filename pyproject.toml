[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "jl-forge"
dynamic = ["version"]
description = "Build steps for JupyterLite sites with xeus-python and Pyodide kernels."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "decitre" }]
classifiers = [
  "Development Status :: 1 - Planning",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["packaging>=24"]

[project.optional-dependencies]
xeus = ["jupyterlite-xeus"]

[project.scripts]
jl-forge = "jl_forge.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "bumpver>=2024", "ruff>=0.8"]
browser = ["pytest>=8", "playwright>=1.50"]

[project.urls]
Homepage = "https://github.com/decitre/jl-forge"
Issues = "https://github.com/decitre/jl-forge/issues"

[tool.hatch.version]
path = "src/jl_forge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/jl_forge"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/LICENSE", "/NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
exclude = ["*.ipynb", "examples/demo/workspace"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.coverage.run]
source = ["src"]

[tool.bumpver]
current_version = "0.3.4"
version_pattern = "MAJOR.MINOR.PATCH[PYTAGNUM]"
commit_message = "bump version {old_version} -> {new_version}"
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"pyproject.toml" = ['^current_version = "{version}"']
"src/jl_forge/__init__.py" = ['^__version__ = "{version}"']
"README.md" = ['^Package version: `{version}`$']
