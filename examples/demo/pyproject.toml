# Demo project built into a JupyterLite site with both kernels.
# [project.dependencies] are installed in the kernels (conda for xeus, piplite for Pyodide).
[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "jl-forge-demo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["packaging>=23", "ipywidgets>=8"]
