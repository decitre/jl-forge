name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this version to PyPI (irreversible)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build and check distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Verify installed package
        run: |
          python -m pip install dist/*.whl
          cd "${RUNNER_TEMP}"
          python -c "from importlib.metadata import version; import jl_forge; assert jl_forge.__version__ == version('jl-forge')"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/jl-forge/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Publish to PyPI using trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
